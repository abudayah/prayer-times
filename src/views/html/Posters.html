<div class="col">
  <div class="card poster-card">
    <check if="{{ @posters }}">
      <true>
        <div id="posterProgress" class="progress" role="progressbar" aria-label="Poster progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 0%"></div>
        </div>

        <div id="posterCarousel" class="carousel carousel-fade">
          <div class="carousel-indicators">
            <repeat group="{{ @posters }}" value="{{ @poster }}" counter="{{ @counter }}">
              <check if="{{ @counter == 1 }}">
                <true>
                  <button type="button" data-bs-target="#posterCarousel" data-bs-slide-to="{{ @counter - 1 }}" class="active" aria-current="true" aria-label="Slide {{ @counter }}"></button>
                </true>
                <false>
                  <button type="button" data-bs-target="#posterCarousel" data-bs-slide-to="{{ @counter - 1 }}" aria-label="Slide {{ @counter }}"></button>
                </false>
              </check>
            </repeat>
          </div>

          <div class="carousel-inner">
            <repeat group="{{ @posters }}" value="{{ @poster }}" counter="{{ @counter }}">
              <check if="{{ @counter == 1 }}">
                <true>
                  <div class="carousel-item active">
                    <img src="{{ @basePath }}{{ @poster.file_path }}" class="d-block" alt="{{ @poster.name }}">
                  </div>
                </true>
                <false>
                  <div class="carousel-item">
                    <img src="{{ @basePath }}{{ @poster.file_path }}" class="d-block" alt="{{ @poster.name }}">
                  </div>
                </false>
              </check>
            </repeat>
          </div>
        </div>
      </true>
      <false>
        <div class="poster-placeholder">
          <div class="poster-placeholder-inner">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="#adb5bd" stroke-width="1">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 16l5-5 4 4 3-3 6 6"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
            </svg>
            <p>No posters yet</p>
            <small>Upload posters from the admin panel</small>
          </div>
        </div>
      </false>
    </check>
  </div>
</div>
<script>
const posterCarouselEl = document.getElementById('posterCarousel');
if (posterCarouselEl) {
  const posterInterval = {{ @posterInterval }} * 1000;
  const posterProgress = document.getElementById('posterProgress');
  const progressBar = posterProgress.querySelector('.progress-bar');
  const posterCarousel = new bootstrap.Carousel(posterCarouselEl);

  function startProgressBar() {
    let width = 0;
    const interval = setInterval(() => {
      width += (100 / (posterInterval / 100));
      progressBar.style.width = `${width}%`;
      if (width >= 100) {
        clearInterval(interval);
        progressBar.style.width = '0%';
        width = 0;
        posterCarousel.next();
        startProgressBar();
      }
    }, 100);
  }

  startProgressBar();
}
</script>
<style>
#posterProgress {
    position: absolute;
    z-index: 2;
    top: 0;
    width: 100%;
}
#posterProgress, #posterProgress .progress-bar {
  height: 4px;
}
.progress-bar {
  background-color: #63927d;
}
.poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f8f9fa;
}
.poster-placeholder-inner {
    text-align: center;
    color: #adb5bd;
}
.poster-placeholder-inner p {
    margin: 1rem 0 0.25rem;
    font-size: 1.1rem;
    font-weight: 600;
}
.poster-placeholder-inner small {
    font-size: 0.85rem;
}
</style>
