<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ @app_title }}</title>
  <link rel="shortcut icon" href="https://theisbc.ca/sites/default/files/isbc-favicon.png" type="image/png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">

  <!-- bootstrap -->  
  <link href="/prayer-times/vendor/twbs/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="/prayer-times/vendor/twbs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

  <!-- font awosome -->
  <link rel="stylesheet" href="/prayer-times/vendor/fortawesome/font-awesome/css/all.min.css">
  <script src="/prayer-times/vendor/fortawesome/font-awesome/js/all.min.js"></script>

  <!-- own style sheets -->
  <link rel="stylesheet" href="/prayer-times/assets/css/style.css">

  <!-- Responsive font scaling for TV screens -->
  <style>
    html { font-size: calc(10px + 0.5vw); }
  </style>

  <!-- jquery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    const refreshInterval = {{ @refreshInterval }};  // minutes, for poster/version check
    const hardReloadInterval = 4 * 60 * 60 * 1000;  // 4 hours in ms
    const pageLoadTime = new Date().toISOString();
    const pageVersion = '{{ @APP_VERSION }}';
    let lastSuccessfulPoll = Date.now();

    setInterval(async () => {
      try {
        const res = await fetch('/prayer-times/last-updated?_=' + Date.now());
        if (!res.ok) return;

        // Successful fetch = confirmed internet connection
        lastSuccessfulPoll = Date.now();

        const data = await res.json();
        const posterChanged = data.last_updated && new Date(data.last_updated) > new Date(pageLoadTime);
        const versionChanged = data.version && data.version !== pageVersion;

        if (posterChanged || versionChanged) {
          window.location.reload(true);
        }
      } catch (e) {
        // Network hiccup — skip this cycle
      }
    }, 1000 * 60 * refreshInterval);

    // Hard reload every 4 hours — only if internet is confirmed
    setInterval(async () => {
      try {
        const res = await fetch('/prayer-times/last-updated?_=' + Date.now());
        if (res.ok) {
          window.location.reload(true);
        }
        // If fetch fails, skip — no internet, don't reload
      } catch (e) {
        // No internet — skip hard reload
      }
    }, hardReloadInterval);
  </script>
</head>
<body class="{{ @bodyClass }}">
  <include href="{{ @content }}" />
</body>
</html>
