<div class="container py-4 admin-container">
    <div class="card shadow-lg p-4 border-0">
        <h6 class="fw-bold text-start mb-4">Upload Poster</h6>

        
        <div class="alert alert-light" role="alert">
            💡 Image size requirement: <strong>width: 770px - hight: 1042px</strong>
        </div>

        <form action="/prayer-times/upload" method="post" enctype="multipart/form-data" class="mb-4">
            <div class="mb-3">
                <label for="name" class="form-label">📝 Poster Name:</label>
                <input type="text" name="name" id="name" class="form-control form-control-lg rounded" required>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">📂 Select Image:</label>
                <input type="file" name="image" id="image" class="form-control form-control-lg rounded" required accept="image/*">
            </div>

            <button type="submit" class="btn btn-success w-100" id="uploadButton">📤 Upload</button>
        </form>
    </div>

    <div class="card shadow-lg p-4 border-0 mt-4">
        <h6 class="fw-bold text-start mb-4">Manage Posters</h6>
        <div class="row g-3">
            <repeat group="{{ @posters }}" value="{{ @poster }}">
                <div class="col-md-4">
                    <div class="card shadow-sm h-100 border-0">
                        <a href="{{ @poster.file_path }}" target="_blank">
                            <img src="{{ @poster.file_path }}" class="card-img-top img-fluid rounded-top" alt="{{ @poster.name }}">
                        </a>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-center">{{ @poster.name }}</h5>
                            <p class="card-text text-muted text-center">📆 {{ @poster.timestamp }}</p>
                            <a href="/prayer-times/delete/{{ @poster.id }}" class="btn btn-danger btn-sm mt-auto">🅧 Delete</a>
                        </div>
                    </div>
                </div>
            </repeat>
        </div>
    </div>
</div>

<style>
    .btn-success {
        background-color: #28a745;
        border: none;
        transition: 0.3s;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    .card {
        border-radius: 12px;
        overflow: hidden;
    }

    .card img {
        max-height: 200px;
        object-fit: cover;
    }
</style>

<script>
    document.getElementById('image').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const img = new Image();
            img.onload = function() {
                if (this.width !== 770 || this.height !== 1042) {
                    alert('Image must be exactly 770px wide and 1042px high.');
                    event.target.value = ''; // Clear the file input
                    document.getElementById('uploadButton').disabled = true;
                } else {
                    document.getElementById('uploadButton').disabled = false;
                }
            };
            img.src = URL.createObjectURL(file);
        }
        else{
            document.getElementById('uploadButton').disabled = true;
        }
    });
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('uploadButton').disabled = true;
    });

</script>
