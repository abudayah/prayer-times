<div class="container py-4 admin-container">
    <div class="card shadow-lg p-4 border-0">
        <h6 class="fw-bold text-start mb-4">Upload Poster</h6>

        <div class="alert alert-light" role="alert">
            💡 Use <strong>A4 portrait</strong> format for best results on the TV screen (e.g. 794×1123px at 96dpi, or 2480×3508px at 300dpi). The TV display maintains A4 ratio automatically.
        </div>

        <form action="/prayer-times/upload" method="post" enctype="multipart/form-data" class="mb-4">
            <div class="mb-3">
                <label for="name" class="form-label">📝 Poster Name:</label>
                <input type="text" name="name" id="name" class="form-control form-control-lg rounded" required>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">📂 Select Image:</label>
                <input type="file" name="image" id="image" class="form-control form-control-lg rounded" required accept="image/*">
                <div id="image-feedback" class="form-text mt-1"></div>
            </div>

            <button type="submit" class="btn btn-success w-100" id="uploadButton" disabled>📤 Upload</button>
        </form>
    </div>

    <div class="card shadow-lg p-4 border-0 mt-4">
        <h6 class="fw-bold text-start mb-4">Manage Posters</h6>
        <div class="row g-3">
            <repeat group="{{ @posters }}" value="{{ @poster }}">
                <div class="col-md-4">
                    <div class="card shadow-sm h-100 border-0">
                        <a href="{{ @poster.file_path }}" target="_blank">
                            <img src="{{ @poster.file_path }}" class="card-img-top img-fluid rounded-top" alt="{{ @poster.name }}">
                        </a>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-center">{{ @poster.name }}</h5>
                            <p class="card-text text-muted text-center">📆 {{ @poster.timestamp }}</p>
                            <a href="/prayer-times/delete/{{ @poster.id }}" class="btn btn-danger btn-sm mt-auto">🅧 Delete</a>
                        </div>
                    </div>
                </div>
            </repeat>
        </div>
    </div>
</div>

<style>
    .btn-success {
        background-color: #28a745;
        border: none;
        transition: 0.3s;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    .card {
        border-radius: 12px;
        overflow: hidden;
    }

    .card img {
        max-height: 200px;
        object-fit: cover;
    }
</style>

<script>
    const MIN_WIDTH   = 700;
    const A4_RATIO    = 1 / 1.4142;   // width / height for portrait A4
    const RATIO_TOL   = 0.05;          // ±5% tolerance

    const imageInput  = document.getElementById('image');
    const uploadBtn   = document.getElementById('uploadButton');
    const feedback    = document.getElementById('image-feedback');

    imageInput.addEventListener('change', function () {
        const file = this.files[0];
        feedback.textContent = '';
        uploadBtn.disabled = true;

        if (!file) return;

        const img = new Image();
        img.onload = function () {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            const ratio = w / h;
            const errors = [];

            if (w < MIN_WIDTH) {
                errors.push(`Width is ${w}px — minimum is ${MIN_WIDTH}px for good TV quality.`);
            }
            if (h <= w) {
                errors.push(`Image must be portrait (taller than wide). Got ${w}×${h}px.`);
            }
            const ratioDiff = Math.abs(ratio - A4_RATIO) / A4_RATIO;
            if (ratioDiff > RATIO_TOL) {
                const expected = Math.round(w * 1.4142);
                errors.push(`Ratio is ${(ratio).toFixed(3)} — expected A4 portrait (~${w}×${expected}px). Current: ${w}×${h}px.`);
            }

            if (errors.length > 0) {
                feedback.innerHTML = errors.map(e => `<span class="text-danger">⚠ ${e}</span>`).join('<br>');
                uploadBtn.disabled = true;
            } else {
                feedback.innerHTML = `<span class="text-success">✓ ${w}×${h}px — looks good!</span>`;
                uploadBtn.disabled = false;
            }

            URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(file);
    });
</script>
